<style>
/* Layout: one column; sticky tab strip + search; summary as unit tiles, each unit as a dense stores ledger */
:root{
  --bg:#f3f5f4;--panel:#fff;--ink:#18201d;--muted:#5c6a64;--line:#d8dfdc;--accent:#d8a400;--accent-ink:#1a1500;
  --warn:#b42318;--warn-bg:#fdecea;--used:#9a3412;--rep:#1f7a45;--chip:#e8ecea;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--panel:#1b211e;--ink:#e7ece9;--muted:#9aa8a1;--line:#2d3632;--accent:#e9b820;--accent-ink:#1a1500;--warn:#ff8a7a;--warn-bg:#3a1c18;--used:#fdba74;--rep:#6ee7a0;--chip:#252d29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614;--panel:#1b211e;--ink:#e7ece9;--muted:#9aa8a1;--line:#2d3632;--accent:#e9b820;--accent-ink:#1a1500;--warn:#ff8a7a;--warn-bg:#3a1c18;--used:#fdba74;--rep:#6ee7a0;--chip:#252d29;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1{font-family:var(--display);font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:none;font:600 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus,.tab:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--display);font-size:20px;letter-spacing:.04em}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted)}
.qn{color:var(--warn);font-weight:600;font-size:13px}
.tot{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 24px;padding:12px 14px;border-top:2px solid var(--ink)}
.tot span{color:var(--muted)} .tot strong{font-size:18px;font-variant-numeric:tabular-nums}
.sx{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
.q{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin-top:12px}
.q b{display:block;margin-bottom:4px}
.q li{margin:2px 0}
.meta{color:var(--muted);font-size:13px;margin-top:10px}
h2{font-family:var(--display);font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:18px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:500 13px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.code{font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.cnt{text-align:right;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.cnt.neg{color:var(--warn)}
.pr{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}.pr b{color:var(--ink,inherit);font-weight:600}
.jc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px}
.u{color:var(--used)} .r{color:var(--rep)}
.note{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-style:italic}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.foot{color:var(--muted);font-size:12.5px;margin-top:18px}
</style>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>'R '+(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const N=v=>v==null?'':(Math.round(v*100)/100).toString();

function tabs(){
  const t=[['summary','Summary'],...D.units.map(u=>[u.k,u.short]),['sales','Sales'],['invoices','Invoices'],['low','Low stock'],['transfers','Transfers']];
  $('tabs').innerHTML=t.map(([k,l])=>`<button class="tab" role="tab" type="button" data-k="${k}" aria-selected="${k===cur}">${l}</button>`).join('');
}
$('tabs').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){location.hash=k}};
window.addEventListener('hashchange',()=>{cur=location.hash.slice(1)||'summary';tabs();render()});
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(render,120)};
function summary(){
  const tc=MSU.reduce((a,u)=>a+sum(u,'cv'),0), ts=MSU.reduce((a,u)=>a+sum(u,'sv'),0);
  let h='<div class="tiles">'+D.units.map(u=>{const counted=u.rows.some(r=>r.n!=null);
    return `<button class="tile" type="button" data-k="${u.k}"><b>${esc(u.short)}</b><small>${esc(u.name)}</small>`+
    (counted?`<span class="v">${R(sum(u,'cv'))}</span><small>cost · ${R(sum(u,'sv'))} selling · ${u.rows.length} lines</small>`:`<small>Not counted yet</small>`)+
    (u.q.length?`<span class="qn">${u.q.length} open ${u.q.length===1?'query':'queries'}</span>`:'')+'</button>'}).join('')+'</div>';
  h+=`<div class="tot"><div><span>All MSUs at cost</span><br><strong>${R(tc)}</strong></div><div><span>All MSUs selling excl.</span><br><strong>${R(ts)}</strong></div></div>`;
  h+='<div class="sx"><table><thead><tr><th>Unit</th>'+SECS.map(s=>`<th>${s}</th>`).join('')+'<th>Total cost</th></tr></thead><tbody>'+
    MSU.map(u=>`<tr><td>${u.short}</td>`+SECS.map(s=>`<td>${R(u.rows.filter(r=>r.s===s).reduce((a,r)=>a+r.cv,0))}</td>`).join('')+`<td><b>${R(sum(u,'cv'))}</b></td></tr>`).join('')+'</tbody></table></div>';
  return h;
}
function unit(u){
  const q=$('q').value.trim().toLowerCase();
  let h=`<p class="meta">${esc(u.name)}${u.by?' · counted by '+esc(u.by):''}${u.date&&u.date!=='None'?' · '+esc(u.date):''}</p>`;
  if(u.q.length) h+=`<div class="q"><b>Open queries (${u.q.length})</b><ul>${u.q.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if(!u.rows.length) return h+'<p class="empty">Not counted yet. Counts will show here once they come in.</p>';
  if(!u.rows.some(r=>r.n!=null)) h+='<p class="meta">Not counted yet. Only stock used before the count is shown.</p>';
  h+=`<div class="tot"><div><span>Cost value</span><br><strong>${R(sum(u,'cv'))}</strong></div><div><span>Selling value excl.</span><br><strong>${R(sum(u,'sv'))}</strong></div><div><span>Lines</span><br><strong>${u.rows.length}</strong></div></div>`;
  for(const s of SECS){
    const rows=u.rows.filter(r=>r.s===s&&(!q||[r.c,r.d,r.cu,r.pl,r.by,r.note].join(' ').toLowerCase().includes(q)));
    if(!rows.length) continue;
    h+=`<h2>${s}<small>${rows.length} lines · ${R(rows.reduce((a,r)=>a+r.cv,0))}</small></h2>`;
    h+=rows.map(r=>{const jc=(r.us||r.rp)?`<div class="jc">${r.us?`<span class="u">Used ${N(r.us)} · ${esc(r.cu)} · ${esc(r.du)}${r.by?' · '+esc(r.by):''}</span>`:''}${r.rp?`<span class="r">Replaced ${N(r.rp)} · ${esc(r.dr)}</span>`:''}</div>`:'';
      return `<div class="it"><div><div class="code">${esc(r.c)}</div><div class="desc">${esc(r.d)}</div></div><div class="cnt${r.n<0?' neg':''}">${N(r.n)} <small>${r.u==='metres'?'m':esc(r.u)} · total ${R(r.cv)}</small></div><div class="pr">Last cost <b>${r.lc!=null?R(r.lc):'–'}</b> · Selling <b>${r.sp!=null?R(r.sp):'–'}</b> each</div>${jc}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>`}).join('');
  }
  return h;
}
function transfers(){
  const q=$('q').value.trim().toLowerCase();
  const T=(D.tr||[]).filter(r=>!q||[r.c,r.d,r.cu,r.pl,r.to].join(' ').toLowerCase().includes(q));
  let h='<p class="meta">Stock sent out of WH100 to replace what an MSU used on a job card. Value at WH100 average cost.</p>';
  if(!T.length) return h+'<p class="empty">No transfers yet.</p>';
  h+=`<div class="tot"><div><span>Value transferred</span><br><strong>${R(T.reduce((a,r)=>a+r.v,0))}</strong></div><div><span>Lines</span><br><strong>${T.length}</strong></div></div>`;
  h+=T.map(r=>`<div class="it"><div><div class="code">${esc(r.c)}</div><div class="desc">${esc(r.d)}</div></div><div class="cnt">${N(r.q)} <small>${R(r.v)}</small></div><div class="jc"><span class="r">${esc(r.dt)} · WH100 to ${esc(r.to)} · ${esc(r.pl)} · ${esc(r.cu)}</span></div></div>`).join('');
  return h;
}
function sales(){
  const q=$('q').value.trim().toLowerCase();
  const S=(D.sa||[]).filter(r=>!q||[r.c,r.d,r.cu,r.doc,r.inv,r.wh,r.by].join(' ').toLowerCase().includes(q));
  let h='<p class="meta">Stock sold on job cards, delivery notes and cash sales, by day. Value at selling price excl. VAT.</p>';
  if(!S.length) return h+'<p class="empty">No sales yet.</p>';
  const pd=s=>{const [d,m,y]=s.split('-');return '20'+y+m+d};
  const days=[...new Set(S.map(r=>r.dt))].sort((a,b)=>pd(b).localeCompare(pd(a)));
  const MSx=['WH600','WH400','WH300','WH500'], M=D.ms||[];
  {const sm=k=>M.reduce((a,r)=>a+(r[k]||0),0), lab=sm('co')+sm('l')+sm('cn'), A=(D.sa||[]), pa=A.reduce((a,r)=>a+r.v,0), pc=A.reduce((a,r)=>a+r.cv,0), ts=pa+lab, tg=ts-pc;
   h+=`<div class="tot"><div><span>Total sales excl.</span><br><strong>${R(ts)}</strong></div><div><span>Parts</span><br><strong>${R(pa)}</strong></div><div><span>Call out + labour</span><br><strong>${R(lab)}</strong></div><div><span>GP</span><br><strong>${R(tg)}</strong> <small class="desc">${ts?(tg/ts*100).toFixed(1)+'%':''}</small></div></div><p class="meta">Total = parts (all units) + MSU call out and labour. The daily list below is parts only.</p>`;}
  if(M.length){
    const card=(n,X,sub)=>{const sm=k=>X.reduce((a,r)=>a+(r[k]||0),0),co=sm('co'),l=sm('l'),p=sm('p'),cn=sm('cn'),c=sm('c'),s=co+l+p+cn,g=s-c,W=X.filter(r=>r.w==='Y'),wv=W.reduce((a,r)=>a+(r.co||0)+(r.l||0)+(r.p||0)+(r.cn||0),0);
      return `<div class="it"><div><div class="code">${esc(n)}</div><div class="desc">${sub?esc(sub)+' · ':''}${X.length} job ${X.length===1?'card':'cards'}</div></div><div class="cnt">${R(s)}<small>sales</small></div><div class="pr">Call out <b>${R(co)}</b> · Labour <b>${R(l)}</b><br>Parts <b>${R(p)}</b> · Consumables <b>${R(cn)}</b><br>Cost of sale <b>${R(c)}</b> · GP <b>${R(g)}</b>${s?` (${(g/s*100).toFixed(1)}%)`:''}<br>Warranties <b>${R(wv)}</b> (${W.length} ${W.length===1?'card':'cards'})</div></div>`};
    const tl=w=>[...new Set(M.filter(r=>r.wh===w&&r.by).map(r=>r.by))].join(', ');
    h+='<h2>Sales per MSU<small>call out, labour, parts, consumables, warranties</small></h2>'+MSx.map(w=>card(w,M.filter(r=>r.wh===w),tl(w))).join('')+card('All MSUs',M,'');
    const T=[...new Set(M.map(r=>r.by).filter(Boolean))];
    h+='<h2>Sales per tech</h2>'+T.map(t=>card(t,M.filter(r=>r.by===t),[...new Set(M.filter(r=>r.by===t).map(r=>r.wh))].join(', '))).join('');
    const sm=k=>M.reduce((a,r)=>a+(r[k]||0),0), ms=sm('co')+sm('l')+sm('p')+sm('cn'), mc=sm('c');
    const W1=(D.sa||[]).filter(r=>!MSx.includes(r.wh)), ws=W1.reduce((a,r)=>a+r.v,0), wc=W1.reduce((a,r)=>a+r.cv,0), wd=new Set(W1.map(r=>r.doc+'|'+r.cu)).size;
    const ts=ms+ws, tc=mc+wc, tg=ts-tc;
    h+=`<h2>Total sales, all combined<small>MSUs + WH100 counter and workshop</small></h2><div class="it"><div><div class="code">All MSUs</div><div class="desc">${M.length} job cards · call out, labour, parts</div></div><div class="cnt">${R(ms)}<small>sales</small></div><div class="pr">Cost <b>${R(mc)}</b> · GP <b>${R(ms-mc)}</b>${ms?` (${((ms-mc)/ms*100).toFixed(1)}%)`:''}</div></div>`+
      `<div class="it"><div><div class="code">WH100</div><div class="desc">${wd} documents · parts only</div></div><div class="cnt">${R(ws)}<small>sales</small></div><div class="pr">Cost <b>${R(wc)}</b> · GP <b>${R(ws-wc)}</b>${ws?` (${((ws-wc)/ws*100).toFixed(1)}%)`:''}</div></div>`+
      `<div class="tot"><div><span>Total sales excl.</span><br><strong>${R(ts)}</strong></div><div><span>Cost of sale</span><br><strong>${R(tc)}</strong></div><div><span>GP</span><br><strong>${R(tg)}</strong> <small class="desc">${ts?(tg/ts*100).toFixed(1)+'%':''}</small></div></div>`;
  }
  h+='<h2>Parts sales per day<small>parts only, no call out or labour</small></h2><div class="sx"><table><thead><tr><th>Date</th><th>Documents</th><th>Parts sales excl.</th><th>Parts cost</th></tr></thead><tbody>'+days.map(d=>{const L=S.filter(r=>r.dt===d);return `<tr><td>${esc(d)}</td><td>${new Set(L.map(r=>r.doc+'|'+r.cu)).size}</td><td><b>${R(L.reduce((a,r)=>a+r.v,0))}</b></td><td>${R(L.reduce((a,r)=>a+r.cv,0))}</td></tr>`}).join('')+'</tbody></table></div>';
  for(const d of days){
    const L=S.filter(r=>r.dt===d); const docs=[...new Set(L.map(r=>r.doc+'|'+r.cu))];
    h+=`<h2>${esc(d)}<small>${docs.length} ${docs.length===1?'document':'documents'} · total ${R(L.reduce((a,r)=>a+r.v,0))}</small></h2>`;
    for(const k of docs){const X=L.filter(r=>r.doc+'|'+r.cu===k), x=X[0];
      h+=`<div class="it"><div><div class="code">${esc(x.doc)}${x.inv?' · Inv '+esc(x.inv):' · <span class="desc">not invoiced yet</span>'}</div><div class="desc">${esc(x.cu)} · ${esc(x.wh)}${x.by?' · '+esc(x.by):''}${X.some(r=>String(r.w).toUpperCase()==='Y')?' · <b>Warranty</b>':''}</div>${(()=>{const m=(D.ms||[]).find(r=>r.doc===x.doc&&r.wh===x.wh);return m&&m.l?`<div class="desc">Parts ${R(X.reduce((a,r)=>a+r.v,0))} · Labour ${R(m.l)}</div>`:''})()}</div><div class="cnt">${R(X.reduce((a,r)=>a+r.v,0))}</div>`+
        `<div class="note" style="font-style:normal">${X.map(r=>`${N(r.q)}${r.u==='metres'?' m':' x'} ${esc(r.c)}`).join(' · ')}</div></div>`}
  }
  return h;
}
function invoices(){
  const q=$('q').value.trim().toLowerCase();
  const I=(D.iv||[]).filter(r=>!q||[r.inv,r.doc,r.cu,r.m].join(' ').toLowerCase().includes(q));
  let h='<p class="meta">Sage tax invoices from Michael\'s email. Date is the day the invoice email came in. Quotes left out.</p>';
  if(!I.length) return h+'<p class="empty">No invoices.</p>';
  const pd=s=>{const [d,m,y]=s.split('-');return '20'+y+m+d};
  const days=[...new Set(I.map(r=>r.dt))].sort((a,b)=>pd(b).localeCompare(pd(a)));
  const t=I.reduce((a,r)=>a+r.a,0);
  h+=`<div class="tot"><div><span>Total sales incl. VAT</span><br><strong>${R(t)}</strong></div><div><span>Excl. VAT</span><br><strong>${R(t/1.15)}</strong></div><div><span>Invoices</span><br><strong>${I.length}</strong></div></div>`;
  for(const d of days){const L=I.filter(r=>r.dt===d).sort((a,b)=>b.inv.localeCompare(a.inv)),s=L.reduce((a,r)=>a+r.a,0);
    h+=`<h2>${esc(d)}<small>${L.length} ${L.length===1?'invoice':'invoices'} · ${R(s)} incl. · ${R(s/1.15)} excl.</small></h2>`;
    h+=L.map(r=>`<div class="it"><div><div class="code">${esc(r.inv)} · ${esc(r.doc)}</div><div class="desc">${r.cu?esc(r.cu)+' · ':''}${esc(r.m)}</div></div><div class="cnt">${R(r.a)}<small>incl.</small></div></div>`).join('');
  }
  return h;
}
function low(){
  const q=$('q').value.trim().toLowerCase();
  const dup=r=>/^(Duplicate|Same item)/.test(r.note||'');
  let h='<p class="meta">Counted lines at 10 or less (units, metres or litres). Out of stock first, then lowest count. Duplicate spellings left out.</p>';
  const L=D.units.map(u=>[u,u.rows.filter(r=>r.n!=null&&r.n<=10&&!dup(r)&&(!q||[r.c,r.d].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.n-b.n||a.c.localeCompare(b.c))]);
  h+=`<div class="tot">${L.map(([u,r])=>`<div><span>${esc(u.short)}</span><br><strong>${r.length}</strong> <small class="desc">${r.filter(x=>x.n<=0).length} out</small></div>`).join('')}</div>`;
  for(const k of ['wh100','wh400','wh300','wh500','wh600']){
    const e=L.find(([u])=>u.k===k); if(!e||!e[1].length) continue; const [u,rows]=e;
    h+=`<h2>${esc(u.short)}<small>${rows.length} lines · ${rows.filter(x=>x.n<=0).length} out of stock</small></h2>`;
    h+=rows.map(r=>`<div class="it"><div><div class="code">${esc(r.c)}</div><div class="desc">${esc(r.d)} · ${esc(r.s)}</div></div><div class="cnt${r.n<=0?' neg':''}">${N(r.n)} <small>${r.u==='metres'?'m':esc(r.u)}</small></div></div>`).join('');
  }
  return h;
}
function render(){
  const u=D.units.find(x=>x.k===cur);
  $('q').hidden=!(u||cur==='transfers'||cur==='low'||cur==='sales'||cur==='invoices');
  $('view').innerHTML=u?unit(u):cur==='transfers'?transfers():cur==='low'?low():cur==='sales'?sales():cur==='invoices'?invoices():summary();
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{location.hash=t.dataset.k});
}
tabs();render();
